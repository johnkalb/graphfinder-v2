name: graphfinder
region: nyc
services:
- name: web
  github:
    branch: main
    repo: YOUR_GITHUB_USERNAME/graphfinder
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  run_command: uvicorn webapp.pathfinder:app --host 0.0.0.0 --port 8000 --workers 2
  envs:
  - key: APP_ENV
    value: production
  - key: SECRET_KEY
    type: SECRET
    value: change-this-to-a-random-string
  - key: SENDGRID_API_KEY
    type: SECRET
    value: change-this
  - key: AUTH_DOMAIN
    value: sixdegrees.net
  - key: PYTHONPATH
    value: /app
  - key: CONTACT_PSI_SERVER_SECRET
    type: SECRET
    value: change-this-set-via-dashboard
  # Must equal the key version the manifest was built with. The LIVE DO spec
  # doesn't set it (so the app's default, 1, applies); manifests are built
  # with 1 since 2026-11-15.
  - key: CONTACT_PSI_KEY_VERSION
    value: "1"
  - key: OPERATOR_EMAIL
    value: change-this-set-via-dashboard
